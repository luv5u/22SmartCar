# Baseline: navigation2/humble nav2_bringup/params/nav2_params.yaml.
# Stage 1 only. Validate localization before enabling navigation commands.
amcl:
  ros__parameters:
    use_sim_time: true  # Gazebo /clock, shared with all simulation nodes.
    base_frame_id: base_footprint  # Match controller odometry child frame.
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /scan  # Gazebo ray sensor; header.frame_id is lidar_link.
    tf_broadcast: true  # AMCL alone owns map -> odom; do not run SLAM.
    transform_tolerance: 1.0
    # Planar nonholonomic odometry noise model; NOT a differential drive
    # velocity controller. AMCL has no built-in Ackermann motion-model plugin.
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_min_range: 0.12  # Match URDF sensor minimum rather than default -1.
    laser_max_range: 8.0  # Match URDF sensor maximum rather than 100 m.
    laser_likelihood_max_dist: 2.0
    max_beams: 60
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    update_min_d: 0.10  # From 0.25 m: update more often on slow corridor runs.
    update_min_a: 0.10  # From 0.20 rad: update more often during gradual turns.
    save_pose_rate: 0.5
    # Approximate prior for the SAME spawn used during mapping. Map origin is
    # near the initial scan, NOT the Gazebo world origin. Verify in RViz;
    # correct using 2D Pose Estimate if the laser does not align with walls.
    # This is a prior only: AMCL still estimates pose from scan + odometry.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''  # Replaced by launch map argument; reuses M3-2/map.yaml.
