# M3-3 / ROS 2 Humble: initial Ackermann baseline, NOT measured tuning results.
# Sources: navigation2/humble nav2_bringup/params/nav2_params.yaml,
# nav2_smac_planner/README.md and nav2_mppi_controller/README.md.
# AMCL/map_server are configured separately in amcl_params.yaml.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0  # model_dt=0.05 s matches this control period.
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001  # No lateral motion; do not retain TB3's 0.5 threshold.
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker  # Humble uses singular key.
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.10  # Default 0.50 -> accommodate 0.35 m/s corridor turns.
      movement_time_allowance: 20.0  # Default 10 -> allow deliberate low-speed turns.
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35  # Default 0.25 -> initial tolerance without in-place rotation.
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController  # Replace TB3 DWB with car-like MPPI.
      motion_model: Ackermann  # Default DiffDrive -> constrain curvature, not pure spin.
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.2
      vy_std: 0.0  # Nonholonomic car has no lateral velocity samples.
      wz_std: 0.4
      vx_max: 0.35  # MPPI default 0.50 -> cautious first navigation run.
      vx_min: 0.0  # Default -0.35 -> forward-only, consistent with DUBIN search.
      vy_max: 0.0  # No holonomic lateral commands.
      wz_max: 0.6  # Default 1.9 -> moderate steering; radius is separately constrained.
      prune_distance: 1.7  # Example value; exceeds 56*0.05*0.35=0.98 m horizon.
      transform_tolerance: 0.2  # Default 0.1 -> tolerate small simulation scheduling delays.
      temperature: 0.3
      gamma: 0.015
      visualize: false  # Avoid trajectory-marker overhead during timing runs.
      reset_period: 1.0  # Humble-specific optimizer reset parameter.
      AckermannConstraints:
        min_turning_r: 0.65  # Default 0.20 -> matches planner, exceeds approximate physical limit.
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic, PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true  # Check rectangular vehicle, not center point alone.
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true  # Hybrid-A* orientations encode forward driving direction.
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: true
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint  # Match odometry, AMCL and planar collision footprint.
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 4  # Default 3 -> horizon 0.98 m plus vehicle fits inside half-width 2 m.
      height: 4
      resolution: 0.05
      # Replace default robot_radius with rectangle including chassis/camera/steered wheels.
      # Physical chassis is 0.45 x 0.22 m; camera reaches x=0.235 m.
      footprint: '[[0.25,0.15],[0.25,-0.15],[-0.25,-0.15],[-0.25,0.15]]'
      footprint_padding: 0.01  # Explicit 1 cm geometric buffer; distinct from inflation costs.
      plugins: [obstacle_layer, inflation_layer]  # 2D ray sensor: no 3D voxel layer needed.
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true  # Clear rays with no return up to raytrace_max_range.
          max_obstacle_height: 2.0
          obstacle_max_range: 7.5  # Sensor max 8 m; leave clearance for reliable hits.
          obstacle_min_range: 0.12  # Match URDF near range.
          raytrace_max_range: 8.0  # Clear within full sensor range.
          raytrace_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55  # Humble example baseline; soft cost extends into 0.95 m gate.
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint  # Same frame and polygon as local costmap.
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      track_unknown_space: true
      footprint: '[[0.25,0.15],[0.25,-0.15],[-0.25,-0.15],[-0.25,0.15]]'
      footprint_padding: 0.01
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          max_obstacle_height: 2.0
          obstacle_max_range: 7.5  # Same sensor limits as local costmap.
          obstacle_min_range: 0.12
          raytrace_max_range: 8.0
          raytrace_min_range: 0.12
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.55  # Baseline, not a hard 0.55 m forbidden band.
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0  # Default 20 -> Hybrid-A* replans at BT's 1 Hz.
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid  # Humble plugin identifier uses '/'.
      tolerance: 0.25  # Example 0.50 -> match positional goal-check tolerance.
      downsample_costmap: false  # Retain 5 cm cells around 0.95 m gate.
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 3.5
      motion_model_for_search: DUBIN  # Forward-only nonholonomic primitives.
      angle_quantization_bins: 72  # Example 64 -> 5 degree heading resolution.
      minimum_turning_radius: 0.65  # Example 0.40 -> same conservative limit as MPPI.
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.5  # >=5*0.65 m to avoid overly short connection attempts.
      reverse_penalty: 2.1  # Inactive for DUBIN; no reverse primitives generated.
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false  # Example true -> laser obstacle updates affect heuristic.
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.2  # Match controller's TF scheduling allowance.
    behavior_plugins: [wait]  # Remove Spin/BackUp/DriveOnHeading for forward-only car.
    wait:
      plugin: nav2_behaviors/Wait

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    # Custom BT never calls SmoothPath: Hybrid-A* already performs constrained smoothing.

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true  # Default false -> scale velocity increments together when limited.
    feedback: OPEN_LOOP
    max_velocity: [0.35, 0.0, 0.6]  # Match MPPI limits; output remains geometry_msgs/Twist.
    min_velocity: [0.0, 0.0, -0.6]  # Forward-only x, bidirectional steering yaw.
    max_accel: [0.5, 0.0, 1.0]  # Default [2.5,0,3.2] -> gentler first-run acceleration.
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5  # Default 1.0 -> same timeout as vehicle controller.

# Humble BT plugin list retained from upstream. Frame follows the controller;
# XML paths are made absolute by bringup.launch.py. Both trees exclude spin/back-up.
